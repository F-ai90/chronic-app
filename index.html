<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>واجهة الاختبار — Chronic App</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style> body{font-family:Arial;direction:rtl;margin:18px} .card{border:1px solid #e6e6e6;padding:12px;border-radius:8px;margin-top:12px} input,button{padding:8px;margin:6px 0} </style>
</head>
<body>
  <div class="card">
    <h2>واجهة اختبار التطبيق</h2>
    <p>الصفحة تعمل محلياً — إذا ظهرت لديك هذه الصفحة فالمشكلة انحلت.</p>

    <label>التاريخ:</label>
    <input type="date" id="dateInput">
    <label>قيمة (مثال):</label>
    <input type="number" id="valueInput" placeholder="مثال 100">
    <div style="margin-top:12px">
      <button onclick="alert('هذه نسخة اختبارية فقط')">زر تجريبي</button>
    </div>
  </div>

  <div class="card" style="margin-top:18px">
    <h3>رسم بياني تجريبي</h3>
    <canvas id="chart" width="700" height="300"></canvas>
  </div>

<script>
  // رسم تجريبي بسيط
  const ctx = document.getElementById('chart').getContext('2d');
  new Chart(ctx, { type:'line', data:{ labels:['1','2','3'], datasets:[{label:'تجريبي', data:[10,20,15], borderColor:'blue'}] } });
</script>
</body>
</html>
