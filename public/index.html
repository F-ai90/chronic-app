<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Chronic Care — MVP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{font-family: Arial, sans-serif; margin:18px; background:#f5f7fb; color:#222}
    .container{max-width:980px;margin:auto}
    .card{background:#fff;border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
    input, select, button{padding:8px;margin:6px 4px;font-size:14px}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{padding:8px;border:1px solid #eee;text-align:center}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    h1,h2,h3{margin:6px 0}
    canvas{width:100%;height:360px;display:block}
    .muted{color:#666;font-size:13px}
  </style>
</head>
<body>
  <div class="container">
    <h1>نظام متابعة الأمراض المزمنة — MVP</h1>

    <div class="card">
      <h3>إضافة مريض جديد</h3>
      <div class="row">
        <input id="p_name" type="text" placeholder="الاسم">
        <input id="p_dob" type="date">
        <select id="p_gender"><option value="">الجنس</option><option value="M">ذكر</option><option value="F">أنثى</option></select>
        <input id="p_mrn" type="text" placeholder="رقم الملف (اختياري)">
        <button id="btnCreate">إضافة</button>
      </div>
      <div class="muted">اضغط "تحديث القائمة" لعرض المرضى المسجلين.</div>
    </div>

    <div class="card">
      <h3>قائمة المرضى</h3>
      <div class="row"><button id="btnRefresh">تحديث القائمة</button></div>
      <table id="patientsTable"><thead><tr><th>#</th><th>الاسم</th><th>DOB</th><th>الجنس</th><th>إجراءات</th></tr></thead><tbody></tbody></table>
    </div>

    <div id="patientArea" class="card" style="display:none">
      <h3>مريض: <span id="selName"></span></h3>

      <div>
        <h4>أدخل قياس جديد </h4>
        <div class="row">
          <select id="condKey">
            <option value="glucose">سكر</option>
            <option value="blood_pressure">ضغط</option>
            <option value="cholesterol">دهون</option>
          </select>
          <input id="measValue" type="text" placeholder="القيمة">
          <input id="measDate" type="date">
          <button id="btnAddMeasure">أدخل القياس</button>
        </div>
      </div>

      <div style="margin-top:12px">
        <h4>الرسم البياني — آخر 3 أشهر</h4>
        <canvas id="chart"></canvas>
      </div>
    </div>

  </div>

  <script src="/app.js"></script>
</body>
</html>
